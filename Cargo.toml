[package]
name = "agora"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "A price-time-priority limit order book and Nasdaq TotalView-ITCH 5.0 replay"
license = "MIT"
repository = "https://github.com/mal0ware/agora"
publish = false

[dependencies]
flate2 = "=1.1.11"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
